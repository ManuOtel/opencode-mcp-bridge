[project]
name = "opencode-mcp-bridge"
version = "0.1.0"
description = "MCP bridge exposing local opencode serve to ChatGPT via Streamable HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4.0",
  "httpx>=0.28",
  "uvicorn>=0.30",
]

[project.scripts]
opencode-mcp-bridge = "opencode_mcp_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_mcp_bridge"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
