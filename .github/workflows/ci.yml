name: ci

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded PR runs to save minutes. Never auto-cancel the
# protected default branch so trusted validation always completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least privilege: jobs only check out code and run local checks.
# Matches release.yml. No new grants.
permissions:
  contents: read

jobs:
  # PR-light lane: fast signal on one current Python (3.14 matches
  # Dockerfile and release.yml). Stays on GitHub-hosted runners.
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Full suite runs in ~15s locally; 20 min caps a hung runner at
    # 1/18th of the 360 min default without risking flakes.
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        # astral-sh/setup-uv v5
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Set up Python 3.14
        run: uv python install 3.14
      - name: Sync dependencies
        run: uv sync --frozen --python 3.14
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Whitespace check
        run: git diff --check
      - name: Validate plugin manifests
        run: |
          for f in \
            server.json \
            .codex-plugin/plugin.json \
            .mcp.json \
            .agents/plugins/marketplace.json \
            .claude-plugin/marketplace.json \
            plugins/claude-code/.claude-plugin/plugin.json \
            plugins/claude-code/.mcp.json; do
            python3 -m json.tool "$f" > /dev/null
          done
  # Trusted-main lane: complete matrix on pushes to master.
  validate-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        # astral-sh/setup-uv v5
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest
      - name: Ruff check
        run: uv run ruff check src tests
      - name: Ruff format check
        run: uv run ruff format --check src tests
      - name: Whitespace check
        run: git diff --check
      - name: Validate plugin manifests
        run: |
          for f in \
            server.json \
            .codex-plugin/plugin.json \
            .mcp.json \
            .agents/plugins/marketplace.json \
            .claude-plugin/marketplace.json \
            plugins/claude-code/.claude-plugin/plugin.json \
            plugins/claude-code/.mcp.json; do
            python3 -m json.tool "$f" > /dev/null
          done
  # Docker build validation runs only on trusted master pushes, after the
  # full matrix passes. No workflow paths filter: validate-main must run on
  # every master push, and a paths-filtered split would risk misleading
  # green main runs that skipped container validation.
  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-main]
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Docker image (no push)
        run: docker build -t opencode-mcp-bridge:ci --file Dockerfile .
