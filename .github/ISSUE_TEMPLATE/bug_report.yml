name: Bug report
description: Report a reproducible fault in the bridge, a plugin, or the docs.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read `CONTRIBUTING.md` and `SECURITY.md` before you file.
        Do not report security faults here. Use GitHub Security Advisories instead.
        Remove all tokens, passwords, private URLs, and personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: State the fault in one or two sentences.
      placeholder: The bridge returns 500 from worker_run when the directory is missing.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: What did you expect? What happened instead?
      placeholder: |
        Expected: a clear error that names the missing directory.
        Actual: a 500 error with no detail.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproducible steps
      description: Numbered steps that reproduce the fault.
      placeholder: |
        1. Start the bridge with uv run python -m opencode_mcp_bridge.server.
        2. Call worker_run with a missing directory.
        3. Read the response.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      description: Which client did you use?
      options:
        - Codex
        - Claude Code
        - GitHub Copilot / Copilot Studio / M365 Copilot
        - MCP Inspector
        - scripts/smoke.sh or curl
        - Other (state below)
    validations:
      required: true
  - type: dropdown
    id: endpoint
    attributes:
      label: Endpoint
      description: Which bridge endpoint did you call?
      options:
        - /worker-mcp
        - /mcp
        - /health
        - Not sure
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Bridge and runtime versions
      description: Bridge version or commit, Python version, and OS.
      placeholder: "Bridge 0.2.0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or error text
      description: Paste short excerpts only. Redact tokens and Authorization headers.
      placeholder: "Paste redacted output here. Remove Bearer values first."
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy statement
      description: You must verify this before you submit.
      options:
        - label: This report holds no tokens, passwords, private URLs, or personal data.
          required: true
